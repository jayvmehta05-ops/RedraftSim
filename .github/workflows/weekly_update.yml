name: Weekly 2027 projection update

on:
  schedule:
    - cron: "0 11 * * 2" # every Tuesday 11:00 UTC (after Monday Night Football)
  workflow_dispatch:
    inputs:
      backfill:
        description: "Rebuild trend snapshots for every earlier week"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Ingest Sleeper + nflverse data
        env:
          ROOKIE_SOURCE_URL: ${{ vars.ROOKIE_SOURCE_URL }}
        run: python scripts/update_data.py

      - name: Project 2027, store snapshot, export web data
        run: |
          if [ "${{ inputs.backfill }}" = "true" ]; then
            python scripts/project_2027.py --backfill
          else
            python scripts/project_2027.py
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Verify the site still builds with the new data
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fantasy_2027.db data/rookies_2027.csv web/data
          if git diff --cached --quiet; then
            echo "No data changes this week."
          else
            git commit -m "data: weekly 2027 projection update ($(date -u +%Y-%m-%d))"
            git push
          fi
